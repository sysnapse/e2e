name: rakazo-web

# PR 合併前最終 e2e 閘（票 TICKET-20261117-03）。
# 觸發：gh workflow run rakazo-web.yml -R sysnapse/e2e -f sha=<rakazo sha> [-f spec=<spec 檔名>]
#
# 被測對象自足：用產品自己的 e2e harness（packages/testkit/src/cli/harness.ts，即
# `pnpm test:e2e`）。它會跑 migrations、起 API 與 Vite web server；資料庫由本 workflow 的
# services: postgres 提供並經 CI_POSTGRES_URL 傳入，所以 runner 不需要 Docker-in-Docker。
#
# 本 workflow 只讀 `sysnapse/rakazo`：checkout 到 runner 的 workspace 後，除注入本 repo 的
# spec 檔外不改任何檔案，亦無 push／commit／寫入產品 repo 的步驟（流程.md §21.3a／§21.3b）。
on:
  workflow_dispatch:
    inputs:
      sha:
        description: '要測的 sysnapse/rakazo commit sha（必填）'
        required: true
        type: string
      spec:
        description: 'Playwright 檔名篩選（預設本 repo 的合併閘 spec）'
        required: false
        default: 'e2e-gate.spec.ts'
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: rakazo-web-${{ inputs.sha }}
  cancel-in-progress: false

env:
  TARGET_REPO: sysnapse/rakazo
  # Electron 的 postinstall 不是允許的 build；本 job 也不需要 Electron。
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  e2e:
    name: rakazo web e2e @ ${{ inputs.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rakazo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rakazo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # 流程.md §21.3b(a)：e2e 內任何 commit 一律用專屬身分 test-auto-bot。
      GIT_AUTHOR_NAME: test-auto-bot
      GIT_AUTHOR_EMAIL: test-auto-bot@users.noreply.github.com
      GIT_COMMITTER_NAME: test-auto-bot
      GIT_COMMITTER_EMAIL: test-auto-bot@users.noreply.github.com
      # harness 見 CI_POSTGRES_URL 就跳過 Testcontainers，直接用這個已起的資料庫。
      CI_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/rakazo
    steps:
      - name: Checkout harness
        uses: actions/checkout@v4

      - name: Echo target sha (evidence for delivery)
        run: |
          echo "TARGET_REPO=sysnapse/rakazo"
          echo "TARGET_SHA=${{ inputs.sha }}"
          echo "SPEC=${{ inputs.spec }}"
          echo "HARNESS_SHA=${{ github.sha }}"
          echo "RUN_ID=${{ github.run_id }}"

      - name: Checkout sysnapse/rakazo at requested sha (read-only token)
        uses: actions/checkout@v4
        with:
          repository: sysnapse/rakazo
          ref: ${{ inputs.sha }}
          # secret RAKAZO_READ_PAT 的名字是歷史遺留：其值是 sysnapse 帳號 token，對
          # sysnapse/rakazo 實為 admin。寫不回產品 repo 不靠權限，靠：本 workflow 無任何
          # 寫入步驟 + persist-credentials: false + permissions: contents read。
          token: ${{ secrets.RAKAZO_READ_PAT }}
          path: rakazo-src
          persist-credentials: false
          fetch-depth: 1

      - name: Verify checked-out sha matches request
        working-directory: rakazo-src
        run: |
          got="$(git rev-parse HEAD)"
          echo "CHECKED_OUT_SHA=$got"
          test "$got" = "${{ inputs.sha }}" || { echo "::error::sha mismatch: wanted ${{ inputs.sha }} got $got"; exit 1; }

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: rakazo-src/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: rakazo-src/pnpm-lock.yaml

      - name: Install workspace dependencies
        working-directory: rakazo-src
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: rakazo-src
        # 同產品 CI：ubuntu-latest 已有 Chromium 需要的 OS 函式庫，跳過 --with-deps 以免 apt 卡死。
        run: pnpm --filter @rakazo/web exec playwright install chromium

      - name: Inject the gate spec into the product e2e harness
        # 只寫入 runner 的 workspace（rakazo-src 是本次 checkout 的暫存目錄），不 push、
        # 不改 repo。harness 的 Playwright testDir 是 apps/web/e2e，spec 必須住在其中。
        run: |
          cp rakazo/web/e2e/e2e-gate.spec.ts rakazo-src/apps/web/e2e/e2e-gate.spec.ts

      - name: Guard - the product checkout only gains the injected spec
        run: |
          changed="$(git -C rakazo-src status --porcelain)"
          echo "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -v -E '^\?\? apps/web/e2e/e2e-gate\.spec\.ts$' | grep -v '^$' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::unexpected changes in the product checkout:"; echo "$unexpected"; exit 1
          fi
          echo "GATE_SPEC_INJECTED=apps/web/e2e/e2e-gate.spec.ts"

      - name: Run e2e harness against the sha under test
        id: run
        continue-on-error: true
        working-directory: rakazo-src
        run: |
          set -o pipefail
          status=0
          pnpm test:e2e -- --spec="${{ inputs.spec }}" 2>&1 | tee ../e2e-run.log || status=$?
          echo "HARNESS_EXIT=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Summarise Playwright counts
        if: always()
        run: |
          {
            echo "TARGET_SHA=${{ inputs.sha }}"
            echo "HARNESS_SHA=${{ github.sha }}"
            echo "RUN_ID=${{ github.run_id }}"
            echo "SPEC=${{ inputs.spec }}"
            echo "HARNESS_EXIT=${{ steps.run.outputs.HARNESS_EXIT }}"
            echo "PW_COUNTS:"
            grep -E '^ +[0-9]+ (passed|failed|flaky|skipped|did not run)' e2e-run.log | tail -20 || true
            echo "PW_TEST_LINES:"
            grep -E '(✓|✘|✗|×)' e2e-run.log | head -20 || true
          } | tee e2e-summary.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rakazo-web-results
          path: |
            e2e-run.log
            e2e-summary.txt
            rakazo-src/apps/web/test-results
            rakazo-src/playwright-report
            rakazo-src/blob-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Gate verdict
        # 閘的判定只有三種結果，且「無測試」永不當綠：harness 非 0、有 failed、
        # 或 log 內沒有 ≥1 passed，一律紅。
        if: always()
        run: |
          status="${{ steps.run.outputs.HARNESS_EXIT }}"
          if [ -z "$status" ]; then
            echo "::error::the harness step did not report an exit code"; exit 1
          fi
          failed="$(grep -Ec '^ +[0-9]+ failed' e2e-run.log || true)"
          passed="$(grep -Eo '^ +[0-9]+ passed' e2e-run.log | tail -1 | grep -Eo '[0-9]+' || true)"
          echo "harness_exit=$status failed_lines=$failed passed_last=${passed:-0}"
          if [ "$status" -ne 0 ]; then
            echo "::error::the e2e harness exited $status"; exit 1
          fi
          if [ "$failed" -ne 0 ]; then
            echo "::error::Playwright reported failures"; exit 1
          fi
          if [ "${passed:-0}" -lt 1 ]; then
            echo "::error::zero tests passed - not a valid gate result (0 tests is never green)"; exit 1
          fi
          echo "GATE=e2e-green sha=${{ inputs.sha }} passed=$passed"
